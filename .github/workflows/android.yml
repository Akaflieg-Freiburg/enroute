name: Compile on Android

on:
  push:
    branches: [ develop ]
    paths-ignore: &paths-ignore
      - ".gitignore"
      - "README.md"
      - "fastlane/metadata/**"
      # ignore CI for other platforms
      - ".github/workflows/api.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: write  # gh release upload to developerBuilds

# A newer push supersedes the builds of an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout enroute
      uses: actions/checkout@v7
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Checkout enrouteDependencies
      uses: actions/checkout@v7
      with:
        path: enrouteDependencies
        repository: Akaflieg-Freiburg/enrouteDependencies
        submodules: recursive
    - name: Read Qt version
      run: echo "QT_VERSION=$(cat enroute/.github/qt-version)" >> "$GITHUB_ENV"
    - name: Install Qt for Android arm64
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: ==3.3.*
        cache: 'true'
        cache-key-prefix: 'install-qt-action-android'
        # Qt >= 6.8 ships its Android packages under the 'all_os' host, not 'linux'.
        # install-qt-action >= 4.4.0 queries 'aqt list-qt <host> android' before
        # installing, and that query only finds 6.8+ under 'all_os'.
        host: 'all_os'
        modules: 'qt5compat qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtsensors qtserialport qtshadertools qtspeech qttasktree qtwebsockets qtwebview'
        target: 'android'
        version: ${{ env.QT_VERSION }}
        arch: 'android_arm64_v8a'
    - name: Set up OpenJDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21
    - name: Install Additional Software
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
        echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
        echo ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018 >> $GITHUB_ENV
    - name: Remove Unwanted Software
      run: |
        # Remove whatever SDK extension platforms the runner image ships, without
        # depending on their exact names
        SDKMANAGER=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager
        EXT_PLATFORMS=$($SDKMANAGER --list_installed | awk '$1 ~ /^platforms;android-.*-ext/ {print $1}')
        if [ -n "$EXT_PLATFORMS" ]; then
          echo "y" | $SDKMANAGER --uninstall $EXT_PLATFORMS
        fi
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: android
        max-size: "500M"  # Limit cache size (default is 2G)
    - name: Compile and Install libzip
      run: |
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enrouteDependencies/libzip \
          -B build-libzip \
          -G Ninja  \
          -DBUILD_DOC=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_REGRESS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TOOLS=OFF \
          -DENABLE_BZIP2=OFF \
          -DENABLE_LZMA=OFF \
          -DENABLE_ZSTD=OFF \
          -DCMAKE_INSTALL_PREFIX=$QT_ROOT_DIR
        cmake --build build-libzip
        cmake --install build-libzip
        rm -rf build-libzip
    - name: Compile and Install maplibre-native-qt
      run: |
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enrouteDependencies/maplibre-native-qt-flat \
          -B build-maplibre-native-qt \
          -G Ninja \
          -DBUILD_TESTING=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
          -DCMAKE_INSTALL_PREFIX=$QT_ROOT_DIR
        cmake --build build-maplibre-native-qt
        cmake --install build-maplibre-native-qt
        rm -rf build-maplibre-native-qt
    - name: Compile Enroute
      run: |
        export QT_HOST_PATH="$(readlink -f "$QT_ROOT_DIR/../gcc_64")"
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enroute \
          -B build-enroute\
          -G Ninja\
          -DCMAKE_BUILD_TYPE:STRING=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache"
        cmake --build build-enroute
    - name: Upload to developerBuilds
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        gh release upload --clobber developerBuilds ../build-enroute/src/android-build//build/outputs/apk/debug/android-build-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: enroute
