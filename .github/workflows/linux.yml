name: Compile on Linux

on:
  push:
    branches: [ develop ]
    paths-ignore: &paths-ignore
      - ".gitignore"
      - "README.md"
      - "fastlane/metadata/**"
      # ignore CI for other platforms
      - ".github/workflows/android.yml"
      - ".github/workflows/api.yml"
      - ".github/workflows/ios.yml"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [ main, develop ]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: write  # gh release upload to developerBuilds

# A newer push supersedes the builds of an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Enroute
      uses: actions/checkout@v7
      with:
        path: enroute
        submodules: recursive
        fetch-depth: 0
    - name: Checkout Enroute Dependencies
      uses: actions/checkout@v7
      with:
        path: enrouteDependencies
        repository: Akaflieg-Freiburg/enrouteDependencies
        submodules: recursive
    - name: Read Qt version
      run: echo "QT_VERSION=$(cat enroute/.github/qt-version)" >> "$GITHUB_ENV"
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: ==3.3.*
        arch: linux_gcc_64
        cache: 'true'
        modules: 'qt5compat qtconnectivity qthttpserver qtimageformats qtlocation qtmultimedia qtpositioning qtserialport qtshadertools qtspeech qttasktree qtwebsockets qtwebview'
        version: ${{ env.QT_VERSION }}
    - name: Install LinuxDeploy
      run: |
        mkdir -p "$RUNNER_TEMP/linuxdeploy"
        cd "$RUNNER_TEMP/linuxdeploy"
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
        chmod +x *.AppImage
        echo "$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_PATH"
    - name: Install Additional Software
      run: |
        sudo apt-get update
        sudo apt-get install -y appstream extra-cmake-modules fuse libgl1-mesa-dri libudev-dev libxcb-cursor0 libzip-dev ninja-build patchelf spirv-tools xvfb zipcmp zipmerge ziptool
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: linux
    - name: Compile and Install maplibre-native-qt
      run: |
        $QT_ROOT_DIR/bin/qt-cmake \
          -S enrouteDependencies/maplibre-native-qt-flat \
          -B build-maplibre-native-qt \
          -G Ninja \
          -DMLN_QT_WITH_INTERNAL_ICU=ON \
          -DBUILD_TESTING=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
          -DCMAKE_INSTALL_PREFIX=$QT_ROOT_DIR
        cmake --build build-maplibre-native-qt
        cmake --install build-maplibre-native-qt
    - name: Compile Enroute Flight Navigation
      run: |
        cmake \
          -B build-enroute \
          -S enroute \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_INSTALL_PREFIX:STRING=$PWD/app/usr \
          -DQTDEPLOY=ON \
          -DQT_DEPLOY_USE_PATCHELF=ON
        cmake --build build-enroute
        cmake --build build-enroute --target install
    - name: Lint QML
      run: |
        cmake --build build-enroute --target all_qmllint
    # Opens every page and dialog and fails on QML errors (DemoRunner::runSmokeTest).
    # The app forces OpenGL, which the headless 'offscreen' platform cannot
    # provide on Linux, so run under Xvfb with Mesa's software renderer.
    - name: Smoke test
      run: |
        timeout 600 xvfb-run -a build-enroute/src/enroute --smoke-test
      env:
        LIBGL_ALWAYS_SOFTWARE: 1
        QT_QPA_PLATFORM: xcb
    # The AppImage below is assembled from app/, which the install step above
    # populated with the default build. This step only keeps the FLIGHTLOG=ON
    # configuration compiling and lint-clean while the flight log is hidden.
    - name: Compile and lint with FLIGHTLOG=ON
      run: |
        cmake -B build-enroute -S enroute -DFLIGHTLOG=ON
        cmake --build build-enroute
        cmake --build build-enroute --target all_qmllint
    - name: Package
      run: |
        linuxdeploy-x86_64.AppImage --appdir app --output appimage
        mv *-x86_64.AppImage enroute-Linux.AppImage
    - name: Upload to developerBuilds
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        gh release upload --clobber developerBuilds ../enroute-Linux.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      working-directory: enroute
