; qmllint settings for Enroute Flight Navigation.
;
; The QML in this project lints clean. Any warning makes the all_qmllint
; build target fail, and the Linux CI job runs that target, so new warnings
; are caught before they are merged. Files that are not ready yet are
; excluded in src/CMakeLists.txt via QT_QML_SKIP_QMLLINT.

[General]
DisableDefaultImports=false
MaxWarnings=0

[Warnings]
; Report these as warnings (Qt's default is a mere note).
MultilineStrings=warning
UnusedImports=warning
